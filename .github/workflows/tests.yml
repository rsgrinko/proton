name: Тесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, mbstring, openssl
          coverage: none

      - name: Синтаксис всех файлов проекта
        run: |
          find app bin config database framework migrations public resources routes tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: php bin/proton test
        run: php bin/proton test

  mysql:
    name: PHP 8.3 · MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: proton_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, openssl
          coverage: none

      - name: php bin/proton test (TEST_DB_DRIVER=mysql)
        env:
          TEST_DB_DRIVER: mysql
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_DATABASE: proton_test
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ''
        run: php bin/proton test
