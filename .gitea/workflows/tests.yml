name: Тесты

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite:
    name: PHP ${{ matrix.php }} · SQLite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    container:
      image: php:${{ matrix.php }}-cli
    steps:
      - name: Расширения pdo_sqlite, pdo_mysql, mbstring
        run: docker-php-ext-install pdo_sqlite pdo_mysql mbstring

      - uses: https://gitea.com/actions/checkout@v4

      - name: Синтаксис всех файлов проекта
        run: |
          find app bin config database framework migrations public resources routes tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: php bin/proton test
        run: php bin/proton test

  mysql:
    name: PHP 8.3 · MySQL
    runs-on: ubuntu-latest
    container:
      image: php:8.3-cli
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: proton_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Расширения pdo_sqlite, pdo_mysql, mbstring
        run: docker-php-ext-install pdo_sqlite pdo_mysql mbstring

      - uses: https://gitea.com/actions/checkout@v4

      - name: php bin/proton test (TEST_DB_DRIVER=mysql)
        env:
          TEST_DB_DRIVER: mysql
          TEST_DB_HOST: mysql
          TEST_DB_PORT: 3306
          TEST_DB_DATABASE: proton_test
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ''
        run: php bin/proton test
